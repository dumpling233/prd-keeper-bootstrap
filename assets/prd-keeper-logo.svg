    <rect x="1" y="1" width="134" height="134" rx="27" stroke="white" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M42 34C42 27.373 47.373 22 54 22H88L110 44V102C110 108.627 104.627 114 98 114H54C47.373 114 42 108.627 42 102V34Z" fill="url(#paper)"/>
    <path d="M88 22V42C88 45.314 90.686 48 94 48H110" fill="#BAF5EA"/>
    <path d="M56 58H91" stroke="#0F766E" stroke-width="6" stroke-linecap="round"/>
    <path d="M56 76H96" stroke="#0F766E" stroke-width="6" stroke-linecap="round" stroke-opacity="0.72"/>
    <path d="M56 94H82" stroke="#0F766E" stroke-width="6" stroke-linecap="round" stroke-opacity="0.46"/>
    <path d="M24 72C24 50.461 41.461 33 63 33" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <path d="M112 64C112 85.539 94.539 103 73 103" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="24" cy="72" r="10" fill="#38BDF8"/>
    <circle cx="112" cy="64" r="10" fill="#A3E635"/>
    <path d="M66 117L77 128L102 99" stroke="#A3E635" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(310 73)">
    <text x="0" y="48" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="800" letter-spacing="0">PRD Keeper</text>
    <text x="2" y="90" fill="#BAF5EA" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="650" letter-spacing="0">Bootstrap</text>
    <g transform="translate(183 68)">
      <rect x="0" y="0" width="250" height="34" rx="17" fill="white" fill-opacity="0.1"/>
      <text x="18" y="23" fill="#D9F99D" font-family="JetBrains Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15" font-weight="700" letter-spacing="0">PRD-first AI SDLC</text>
    </g>
  </g>

  <path d="M735 76H812" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M735 104H838" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M735 132H804" stroke="#A3E635" stroke-width="4" stroke-linecap="round" stroke-opacity="0.55"/>
